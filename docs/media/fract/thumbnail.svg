<svg xmlns="http://www.w3.org/2000/svg" width="320" height="192" viewBox="0 0 320 192" role="img" aria-labelledby="title description">
<title id="title">FRACT — minimal granular interface illustration</title>
<desc id="description">Six parameter readouts around one continuous waveform with three filled grain squares. Two horizontal range bars align with the group’s outer left and right edges, placed halfway between the waveform and the SIZE/SHPE readouts. No side chrome, vertical partitions or waveform gaps. Spread 64 and pitch 1. Conceptual artwork, not a live screen capture.</desc>
